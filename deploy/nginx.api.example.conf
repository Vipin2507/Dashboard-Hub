# Example nginx for api.buildesk.ae (Node on 127.0.0.1:4000).
# The SPA calls this host cross-origin from https://dashboard.buildesk.ae.
#
# If Node/PM2 is down, nginx returns 502 without CORS headers and the browser
# reports a CORS error. The `always` headers below keep the real status visible
# and still allow the dashboard to read error responses.

server {
    listen 443 ssl http2;
    server_name api.buildesk.ae;

    # CORS for dashboard SPA (also on error responses)
    set $cors_origin "";
    if ($http_origin ~* "^https://dashboard\.buildesk\.ae$") {
        set $cors_origin $http_origin;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin $http_origin;

        # WebSocket (realtime)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Content-Type" always;
        add_header Vary Origin always;
    }
}
